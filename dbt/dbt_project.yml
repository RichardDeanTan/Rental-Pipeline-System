name: 'dvd_rental_pipeline'
version: '1.0.0'
config-version: 2

profile: 'dvd_rental_pipeline'

model-paths: ["models"]
snapshot-paths: ["snapshots"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
test-paths: ["tests"]
analysis-paths: ["analyses"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  dvd_rental_pipeline:
    staging:
      +materialized: view
      +schema: silver
    gold:
      +materialized: table
      +schema: gold

snapshots:
  dvd_rental_pipeline:
    +target_schema: gold